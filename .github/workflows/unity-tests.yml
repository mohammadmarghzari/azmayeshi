name: Ferrum Protocol - Unity Tests

# Runs the EditMode test suite (Assets/Scripts/Tests/EditMode) on every push/PR that touches
# the Unity project. Requires a UNITY_LICENSE (and UNITY_EMAIL/UNITY_PASSWORD for personal
# licenses) secret configured in the repo settings - see Documentation/HANDBOOK_FA.md.
# Uses game-ci (https://game.ci), the standard open-source Unity CI toolchain.
on:
  push:
    branches: [main]
    paths:
      - "FerrumProtocol/**"
  pull_request:
    paths:
      - "FerrumProtocol/**"
  workflow_dispatch:

jobs:
  test:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: FerrumProtocol/Library
          key: Library-FerrumProtocol-${{ hashFiles('FerrumProtocol/Assets/**', 'FerrumProtocol/Packages/**') }}
          restore-keys: |
            Library-FerrumProtocol-

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: FerrumProtocol
          testMode: EditMode
          artifactsPath: test-results
          checkName: EditMode Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
